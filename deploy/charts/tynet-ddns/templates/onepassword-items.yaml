{{- range $secret, $item := .Values.onePassword.items }}
---
# itemPath is vaults/<vault>/items/<item>. The operator creates a Secret
# named after this resource, keyed by the item's field labels. Resolved by
# this app's own operator instance (gitops/ddns-onepassword-operator in
# tynet-infra, watchNamespace: ["ddns"]) — not meal-planner's.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $secret }}
  labels: {{- include "tynet-ddns.labels" $ | nindent 4 }}
  annotations:
    operator.1password.io/auto-restart: {{ $.Values.onePassword.autoRestart | quote }}
spec:
  itemPath: "vaults/{{ $.Values.onePassword.vault }}/items/{{ $item }}"
{{- end }}
